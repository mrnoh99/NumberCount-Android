<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NumberCount — 숫자 세기 퀴즈</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- ── Top Bar ── -->
  <header id="top-bar">
    <div id="top-left">
      <div class="btn-group" id="diff-group">
        <button class="ctrl-btn" data-diff="5">Easy</button>
        <button class="ctrl-btn" data-diff="10">Hard</button>
      </div>
      <div class="btn-group" id="mode-group">
        <button class="ctrl-btn" data-mode="OBJECTS_TO_NUMBER" title="물건 → 숫자">1·2·3</button>
        <button class="ctrl-btn" data-mode="NUMBER_TO_OBJECTS" title="숫자 → 물건">🍎·🍎</button>
      </div>
    </div>
    <div id="top-right">
      <div id="score-display"></div>
      <button id="lang-btn" class="ctrl-btn"></button>
      <button id="settings-btn" aria-label="설정">⚙</button>
    </div>
  </header>

  <!-- ── Game Board ── -->
  <main id="game-board">
    <div id="display-area"></div>
    <div id="options-grid"></div>
  </main>

  <!-- ── Correct/Wrong Feedback Overlay ── -->
  <div id="feedback-overlay" hidden>
    <div id="feedback-content">
      <img id="feedback-img" alt="">
      <button id="next-btn" hidden></button>
    </div>
  </div>

  <!-- ── Counting Hint Panel ── -->
  <div id="hint-panel" hidden>
    <div id="hint-content">
      <div id="hint-items"></div>
      <div id="hint-label"></div>
    </div>
  </div>

  <!-- ── Settings Modal ── -->
  <div id="settings-modal" hidden>
    <div id="settings-inner">
      <div id="settings-header">
        <h2 id="settings-title"></h2>
        <button id="settings-close">✕</button>
      </div>

      <div class="setting-section">
        <div class="setting-label" id="label-language"></div>
        <div class="btn-group" id="lang-group">
          <button class="ctrl-btn" data-lang="ko">한국어</button>
          <button class="ctrl-btn" data-lang="en">English</button>
        </div>
      </div>

      <div class="setting-section">
        <div class="setting-label" id="label-categories"></div>
        <div class="btn-group wrap" id="cat-group">
          <button class="toggle-btn" data-cat="FRUIT">🍎 과일 / Fruit</button>
          <button class="toggle-btn" data-cat="CAR">🚗 차 / Car</button>
          <button class="toggle-btn" data-cat="VEGETABLE">🥕 채소 / Vegetable</button>
        </div>
      </div>

      <div class="setting-section">
        <div class="setting-label" id="label-bgm"></div>
        <div class="setting-control">
          <label class="switch">
            <input type="checkbox" id="bgm-checkbox">
            <span class="switch-slider"></span>
          </label>
          <input type="range" id="bgm-volume-slider" min="0" max="1" step="0.01">
        </div>
      </div>
    </div>
  </div>

  <!-- ── Audio ── -->
  <audio id="bgm" loop preload="auto">
    <source src="assets/waltz_for_you.mp3" type="audio/mpeg">
  </audio>
  <audio id="chime-correct" preload="auto">
    <source src="assets/signal_correct.wav" type="audio/wav">
  </audio>
  <audio id="chime-wrong" preload="auto">
    <source src="assets/signal_wrong.wav" type="audio/wav">
  </audio>

</div>
<script src="game.js"></script>
</body>
</html>
